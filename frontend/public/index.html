<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administração de Aluguel — Inerente</title>
<link rel="icon" href="logo.png">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#16181d;--mut:#6b7280;--ln:#e3e6eb;--az:#29c5f6;--pg:#16a34a;--ac:#eab308;--at:#b91c1c;--ve:#ef4444}
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;align-items:center;gap:12px;padding:10px 20px;background:#111;color:#fff;position:sticky;top:0;z-index:5}
header img{height:28px}header b{font-size:16px}header .sp{flex:1}header a{color:#cbd5e1;text-decoration:none;font-size:13px}
main{max-width:1250px;margin:0 auto;padding:18px}
button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:#fff;border-radius:7px;padding:7px 12px}
button.pri{background:var(--az);border-color:var(--az);color:#00202d;font-weight:600}
button.per{color:var(--at);border-color:#fecaca}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;border:1px solid var(--ln);border-radius:7px;padding:7px 9px;width:100%;background:#fff}
textarea{min-height:60px}
label{font-size:12px;color:var(--mut);display:block;margin:0 0 3px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 10px}
.tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.tot div{background:#f8fafc;border:1px solid var(--ln);border-radius:9px;padding:9px}
.tot b{display:block;font-size:17px}
.bt{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:20}
.modal .card{width:min(860px,100%);margin:0}
.aviso{background:#fef2f2;color:#7f1d1d;border:1px solid #fecaca;border-radius:8px;padding:8px 10px;margin:8px 0}
.info{background:#f0f9ff;color:#0c4a6e;border:1px solid #bae6fd;border-radius:8px;padding:8px 10px;margin:8px 0}
.ok{background:#f0fdf4;color:#14532d;border:1px solid #bbf7d0;border-radius:8px;padding:8px 10px;margin:8px 0}
.mut{color:var(--mut);font-size:12px}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin:10px 0 20px}
.mod{text-align:left;background:var(--card);border:1px solid var(--ln);border-left:6px solid #1d4ed8;border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:8px;cursor:pointer;min-height:130px}
.mod:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}.mod b{font-size:19px}.mod span{color:#666}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.cb{text-align:left;background:#fff;border:1px solid var(--ln);border-left:5px solid #d1d5db;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:5px;cursor:pointer}
.cb:hover{box-shadow:0 3px 12px rgba(0,0,0,.07)}
.cb b{font-size:15px}.cb .v{font-size:17px;font-weight:700}
.cb.verde{border-left-color:var(--pg)}.cb.vermelho{border-left-color:var(--ve)}.cb.amarelo{border-left-color:var(--ac)}.cb.azul{border-left-color:#1d4ed8}.cb.cinza{border-left-color:#9ca3af;opacity:.8}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:#eef2f7}
.tag.ok{background:#dcfce7;color:#14532d}.tag.al{background:#fee2e2;color:#7f1d1d}.tag.am{background:#fef9c3;color:#713f12}
.lin{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--ln)}
.lin:last-child{border-bottom:0}.neg{color:var(--at)}.pos{color:#15803d}
.mes{border:1px solid var(--ln);border-radius:12px;padding:12px;background:#fff}
.mes h4{margin:0 0 6px;display:flex;justify-content:space-between}
.abas{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.abas button.on{background:#111;color:#fff;border-color:#111}
.dia{margin:16px 0 8px;font-weight:700;font-size:15px}
.hid{display:none}
@media print{header,.bt,.abas,.noprint{display:none!important}body{background:#fff}.card,.mes{border:0}}
</style>
</head>
<body>
<header><img src="logo.png" alt=""><b>Administração de Aluguel</b><span class="sp"></span><span id="quem" style="font-size:13px;color:#cbd5e1"></span><a href="https://portalinerente.netlify.app">← Portal</a><button id="sair" class="hid" style="padding:4px 10px" onclick="sair()">Sair</button></header>
<main id="app"><div class="card">Carregando…</div></main>
<div id="modal"></div><div id="modal2"></div>
<script src="ferramentas/le-acerto-mensal.js"></script>
<script src="ferramentas/contratos.js"></script>
<script>
const $=s=>document.querySelector(s), app=$('#app');
const BASE=/^(localhost|127\.)/.test(location.hostname)?'':'https://locacao-production-7f7f.up.railway.app';
let TOKEN='';try{TOKEN=localStorage.getItem('loc_token')||''}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dbr=d=>d?String(d).slice(0,10).split('-').reverse().join('/'):'—';
const R2=x=>Math.round((+x||0)*100)/100;
const hoje=()=>new Date(Date.now()-3*3600e3).toISOString().slice(0,10);
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const nomeMes=c=>c?MESES[+c.slice(5)-1].replace(/^./,x=>x.toUpperCase())+' '+c.slice(0,4):'';
const somaMes=(c,n)=>{const d=new Date(Date.UTC(+c.slice(0,4),+c.slice(5)-1+n,1));return d.toISOString().slice(0,7)};
const TIPOS={aluguel:'Aluguel',rescisao:'Multa de rescisão',encargos:'Juros e multa',adm:'Administração',intermediacao:'Intermediação',condominio:'Condomínio',fundo_reserva:'Fundo de reserva',retencao:'Retido para condomínio',iptu:'IPTU',agua:'Água',energia:'Energia',gas:'Gás',manutencao:'Manutenção / outros gastos',caucao:'Caução',repasse:'Repasse',outros:'Outros'};
const sel=(id,opts,v)=>`<select id="${id}">${opts.map(o=>{const[k,t]=Array.isArray(o)?o:[o,o];return`<option value="${esc(k)}" ${String(v??'')===String(k)?'selected':''}>${esc(t)}</option>`}).join('')}</select>`;
const fecha=()=>{$('#modal').innerHTML=''};
const modal=h=>{$('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)fecha()"><div class="card">${h}</div></div>`};
const modal2=h=>{$('#modal2').innerHTML=`<div class="modal" style="z-index:30"><div class="card">${h}</div></div>`};const fecha2=()=>{$('#modal2').innerHTML=''};
const val=id=>{const e=document.getElementById(id);if(!e)return undefined;if(e.type==='checkbox')return e.checked;return e.value.trim()};
async function api(path,opt={}){
  const r=await fetch(BASE+'/api/'+path,{method:opt.method||'GET',headers:{authorization:'Bearer '+TOKEN,'content-type':'application/json'},body:opt.body?JSON.stringify(opt.body):undefined});
  const d=await r.json().catch(()=>({erro:'Resposta inválida do servidor'}));
  if(r.status===401){TOKEN='';try{localStorage.removeItem('loc_token')}catch(e){}telaLogin(d?.erro);throw new Error('401')}
  if(!r.ok||d?.erro){aviso(d?.erro||'Erro');throw new Error(d?.erro||'erro')}
  return d;
}
const voltar=(h,t='← Início da locação')=>`<div class="bt noprint" style="margin-bottom:10px"><button onclick="location.hash='${h}'">${t}</button></div>`;

/* ---------- formulário genérico ---------- */
function campos(L,o={}){return `<div class="f2">${L.map(c=>{const v=o[c.k]??c.d??'';const id='f_'+c.k;
  let inp;if(c.t==='sel')inp=sel(id,c.o,v);else if(c.t==='chk')inp=`<label style="display:flex;gap:6px;align-items:center;color:var(--tx);font-size:14px"><input id="${id}" type="checkbox" style="width:auto" ${v?'checked':''}> ${esc(c.l)}</label>`;
  else if(c.t==='area')inp=`<textarea id="${id}">${esc(v)}</textarea>`;else inp=`<input id="${id}" type="${c.t||'text'}" ${c.t==='number'?'step="0.01"':''} value="${esc(c.t==='date'?String(v).slice(0,10):v)}">`;
  return `<div ${c.w?'style="grid-column:1/-1"':''}>${c.t==='chk'?'':`<label>${esc(c.l)}</label>`}${inp}</div>`}).join('')}</div>`}
const coleta=L=>{const o={};for(const c of L){const v=val('f_'+c.k);o[c.k]=c.t==='chk'?!!v:(v===''?null:v)}return o};

/* ---------- rotas ---------- */
/* aviso na própria tela (sem janela do navegador, que trava a página) */
function aviso(msg){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:12px 18px;border-radius:10px;z-index:99;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)';document.body.appendChild(el)}
  el.textContent=msg;el.style.display='block';clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',6000)}
let EU=null;
function telaLogin(msg){$('#sair').classList.add('hid');$('#quem').textContent='';
  app.innerHTML=`<div class="card" style="max-width:400px;margin:60px auto"><h3>Entrar</h3>${msg?`<div class="aviso">${esc(msg)}</div>`:''}<div class="info">O jeito mais fácil é entrar pelo Portal Inerente, no cartão "Administração de Aluguel".</div>
  <label>E-mail</label><input id="lg_e" type="email" autocomplete="username"><br><br><label>Senha</label><input id="lg_s" type="password" autocomplete="current-password"><br><br><button class="pri" id="lg_b">Entrar</button></div>`;
  const go=async()=>{const r=await fetch(BASE+'/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:val('lg_e'),senha:$('#lg_s').value})});const d=await r.json().catch(()=>({}));
    if(!r.ok||!d.token)return telaLogin(d.erro||'Não foi possível entrar.');TOKEN=d.token;try{localStorage.setItem('loc_token',TOKEN)}catch(e){}iniciar()};
  $('#lg_b').onclick=go;$('#lg_s').onkeydown=e=>{if(e.key==='Enter')go()}}
function sair(){TOKEN='';try{localStorage.removeItem('loc_token')}catch(e){}telaLogin()}
async function iniciar(){
  const sso=new URLSearchParams(location.search).get('sso');
  if(sso){try{history.replaceState(null,'',location.pathname+location.hash)}catch(e){}
    const r=await fetch(BASE+'/api/auth/sso',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:sso})});const d=await r.json().catch(()=>({}));
    if(r.ok&&d.token){TOKEN=d.token;try{localStorage.setItem('loc_token',TOKEN)}catch(e){}}else if(!TOKEN)return telaLogin(d.erro)}
  if(!TOKEN)return telaLogin();
  try{EU=await api('eu')}catch(e){return}
  $('#quem').textContent=EU.nome||'';$('#sair').classList.remove('hid');
  if(!EU.admin){app.innerHTML='<div class="card"><h3>Administração de Aluguel</h3>Por enquanto o acesso é só do administrador.</div>';return}
  route();
}
window.onhashchange=()=>route();
function route(){const h=location.hash.slice(1),[a,b]=h.split('/');fecha();
  if(a==='calendario')telaCalendario(b);else if(a==='imoveis')telaImoveis();else if(a==='imovel')telaImovel(b);else if(a==='pessoas')telaPessoas();
  else if(a==='locacoes')telaLocacoes();else if(a==='locacao')telaLocacao(b);else if(a==='inadimplencia')telaInad();else if(a==='reajustes')telaReajustes();
  else if(a==='importar')telaImportar();else telaInicio()}

/* ---------- início ---------- */
async function telaInicio(){
  const p=await api('loc/painel');
  app.innerHTML=`<div class="tot">
    <div><span class="mut">Contratos de locação ativos</span><b>${p.locacoes}</b></div>
    <div><span class="mut">Aluguel por mês</span><b>${brl(p.aluguel_mes)}</b></div>
    <div><span class="mut">Administração por mês</span><b>${brl(p.adm_mes)}</b></div>
    <div><span class="mut">Em atraso (com encargos)</span><b class="${p.atrasadas?'neg':''}">${p.atrasadas} · ${brl(p.atrasado_valor)}</b></div>
    <div><span class="mut">A repassar aos proprietários</span><b>${brl(p.a_repassar)}</b></div>
    <div><span class="mut">Reajustes no próximo mês</span><b>${p.reajustes}</b></div>
    <div><span class="mut">Garantias vencidas ou vencendo</span><b class="${p.garantias?'neg':''}">${p.garantias}</b></div>
    <div><span class="mut">Condomínio/IPTU sem comprovante</span><b class="${p.obrigacoes_pendentes?'neg':''}">${p.obrigacoes_pendentes}</b></div></div>
  <div class="mods">
    <div class="mod" style="border-left-color:#0d9488" onclick="location.hash='calendario'"><b>Calendário do mês</b><span>Dia 10, 20 e 30: quem pagou, quanto foi repassado e o que falta. Gera as cobranças do mês.</span></div>
    <div class="mod" style="border-left-color:#1d4ed8" onclick="location.hash='imoveis'"><b>Imóveis</b><span>${p.imoveis} imóvel(is). Ficha, contrato de administração, conta corrente do proprietário (acerto mensal) e documentos.</span></div>
    <div class="mod" style="border-left-color:#7c3aed" onclick="location.hash='locacoes'"><b>Contratos de locação</b><span>Inquilino, garantia, vencimento, cobranças, pagamentos, reajustes e encerramento.</span></div>
    <div class="mod" style="border-left-color:#b45309" onclick="location.hash='pessoas'"><b>Proprietários e inquilinos</b><span>${p.pessoas} cadastro(s). Um cadastro por CPF/CNPJ.</span></div>
    <div class="mod" style="border-left-color:#dc2626" onclick="location.hash='inadimplencia'"><b>Inadimplência</b><span>Aluguéis em atraso com multa, juros e cobrança calculados pelo contrato.</span></div>
    <div class="mod" style="border-left-color:#ca8a04" onclick="location.hash='reajustes'"><b>Reajustes</b><span>Aniversário dos contratos e índice acumulado buscado no Banco Central.</span></div>
    <div class="mod" style="border-left-color:#475569" onclick="location.hash='importar'"><b>Importar planilha</b><span>Traz o histórico da planilha "Acerto Mensal" de cada imóvel, mês a mês, conferindo com o total da planilha.</span></div>
    <div class="mod" style="border-left-color:#64748b" onclick="baixaCopia()"><b>Cópia de segurança</b><span>Baixa uma cópia de todos os dados da locação. Guarde no Drive de vez em quando.</span></div>
  </div>`;
}

/* ---------- pessoas ---------- */
const C_PES=[{k:'nome',l:'Nome completo',w:1},{k:'nacionalidade',l:'Nacionalidade (para o contrato)',d:'brasileiro(a)'},{k:'tipo',l:'Tipo',t:'sel',o:[['pf','Pessoa física'],['pj','Empresa']]},{k:'documento',l:'CPF / CNPJ'},{k:'rg',l:'RG'},{k:'estado_civil',l:'Estado civil'},{k:'profissao',l:'Profissão'},{k:'nascimento',l:'Nascimento',t:'date'},{k:'telefone',l:'Telefone principal'},{k:'email',l:'E-mail'},{k:'endereco',l:'Endereço',w:1},{k:'pix',l:'Chave Pix (para repasse)'},{k:'banco',l:'Banco / agência / conta'},{k:'obs',l:'Observações',t:'area',w:1}];
let PES=[];
async function telaPessoas(){PES=await api('loc/pessoas');
  app.innerHTML=voltar('')+`<div class="card"><div class="bt"><h3 style="margin:0;flex:1">Proprietários e inquilinos</h3><input id="bp" placeholder="Buscar por nome, CPF ou telefone" style="max-width:320px" oninput="desenhaPessoas()"><button class="pri" onclick="modalPessoa()">+ Novo cadastro</button></div></div><div class="cgrid" id="lp"></div>`;desenhaPessoas()}
function desenhaPessoas(){const b=(val('bp')||'').toLowerCase().replace(/\D/g,'')||(val('bp')||'').toLowerCase();
  const L=PES.filter(p=>!b||(p.nome||'').toLowerCase().includes(b)||(p.documento||'').includes(b)||(p.telefone||'').replace(/\D/g,'').includes(b));
  $('#lp').innerHTML=L.map(p=>`<div class="cb ${p.inquilino_de?'azul':p.proprietario_de?'verde':''}" onclick="modalPessoa(${p.id})"><b>${esc(p.nome)}</b><span class="mut">${esc(p.documento||'sem CPF/CNPJ')} · ${esc(p.telefone||'sem telefone')}</span>
    ${p.proprietario_de?`<span class="tag ok">Proprietário: ${esc(p.proprietario_de)}</span>`:''}${p.inquilino_de?`<span class="tag">Inquilino: ${esc(p.inquilino_de)}</span>`:''}</div>`).join('')||'<div class="mut">Nenhum cadastro.</div>'}
function modalPessoa(id,depois){const p=PES.find(x=>x.id===id)||{};
  (depois?modal2:modal)(`<h3>${id?'Cadastro':'Novo cadastro'}</h3>${campos(C_PES,p)}${p.telefones_antigos?.length?`<div class="mut" style="margin-top:6px">Telefones antigos: ${p.telefones_antigos.map(esc).join(', ')}</div>`:''}
  <div class="bt" style="margin-top:12px"><button class="pri" onclick="salvaPessoa(${id||0})">Salvar</button><button onclick="${depois?'fecha2()':'fecha()'}">Cancelar</button>${id?`<button class="per" onclick="excluiPessoa(${id})">Excluir</button>`:''}</div>`);
  window._depoisPessoa=depois||null}
async function salvaPessoa(id){const b=coleta(C_PES);const r=await api('loc/pessoa'+(id?'/'+id:''),{method:id?'PUT':'POST',body:b});
  if(window._depoisPessoa){fecha2();const f=window._depoisPessoa;window._depoisPessoa=null;return f(r)}fecha();if(location.hash==='#pessoas')telaPessoas();else route()}
async function excluiPessoa(id){if(!confirm('Excluir esse cadastro?'))return;await api('loc/pessoa/'+id,{method:'DELETE'});fecha();telaPessoas()}
function novaPessoaEm(idCampo){modalPessoa(0,r=>{PES.push(r);const s=document.getElementById(idCampo);const o=document.createElement('option');o.value=r.id;o.textContent=r.nome;s.appendChild(o);s.value=r.id})}
async function escolhePessoa(idCampo,rotulo){PES=PES.length?PES:await api('loc/pessoas');
  return `<label>${rotulo}</label><div class="bt"><select id="${idCampo}" style="flex:1"><option value="">— escolha —</option>${PES.map(p=>`<option value="${p.id}">${esc(p.nome)}${p.documento?' · '+esc(p.documento):''}</option>`).join('')}</select><button type="button" onclick="novaPessoaEm('${idCampo}')">+ novo</button></div>`}

/* ---------- imóveis ---------- */
const C_IMO=[{k:'apelido',l:'Nome do imóvel (como vocês chamam)',w:1},{k:'tipo',l:'Tipo',t:'sel',o:[['apartamento','Apartamento'],['casa','Casa'],['sala','Sala comercial'],['loja','Loja'],['galpao','Galpão'],['terreno','Terreno'],['kitnet','Kitnet / studio'],['outro','Outro']]},
  {k:'endereco',l:'Endereço',w:1},{k:'unidade',l:'Unidade / torre'},{k:'condominio',l:'Condomínio (nome)'},{k:'administradora',l:'Administradora do condomínio'},{k:'matricula',l:'Matrícula'},{k:'inscricao_iptu',l:'Inscrição do IPTU'},
  {k:'area',l:'Área (m²)',t:'number'},{k:'quartos',l:'Quartos',t:'number'},{k:'vagas',l:'Vagas',t:'number'},{k:'energia',l:'Energia (nº da unidade consumidora)'},{k:'agua',l:'Água (matrícula Saneago)'},{k:'gas',l:'Gás (nº do cliente)'},
  {k:'extras_txt',l:'Garagens, box e escaninho com IPTU próprio (um por linha: descrição — inscrição)',t:'area',w:1},{k:'pasta',l:'Link da pasta no Drive',w:1},
  {k:'finalidade',l:'Finalidade da locação',t:'sel',o:[['residencial','Residencial'],['comercial','Comercial (não residencial)']]},{k:'cidade',l:'Cidade',d:'Goiânia'},
  {k:'descricao_contrato',l:'Descrição do imóvel para o contrato (unidade, vagas, empreendimento, endereço, quadra, lote, bairro, CEP)',t:'area',w:1},
  {k:'aluguel_minimo',l:'Aluguel mínimo acordado com o proprietário (R$)',t:'number'},{k:'repasse_minimo',l:'Mínimo que o proprietário recebe por mês, já sem a taxa (R$)',t:'number'},
  {k:'ativo',l:'Imóvel ativo na carteira',t:'chk',d:true},{k:'obs',l:'Observações',t:'area',w:1}];
async function telaImoveis(){const I=await api('loc/imoveis');
  app.innerHTML=voltar('')+`<div class="card"><div class="bt"><h3 style="margin:0;flex:1">Imóveis</h3><button class="pri" onclick="modalImovel()">+ Novo imóvel</button></div></div>
  <div class="cgrid">${I.map(i=>`<div class="cb ${!i.ativo?'cinza':i.locacao?'verde':'amarelo'}" onclick="location.hash='imovel/${i.id}'"><b>${esc(i.apelido)}</b>
    <span class="mut">Proprietário: ${esc(i.proprietario||'—')}</span>
    ${i.locacao?`<span>Inquilino: ${esc(i.locacao.locatario)}</span><span>${brl(i.locacao.aluguel)} · dia ${i.locacao.dia}</span>`:`<span class="tag am">${i.ativo?'Vago':'Inativo'}</span>`}
    <span class="mut">Saldo do proprietário: <b class="${+i.saldo<0?'neg':''}">${brl(i.saldo)}</b></span></div>`).join('')||'<div class="mut">Nenhum imóvel ainda. Cadastre ou use "Importar planilha".</div>'}</div>`}

async function salvaImovel(id){const b=coleta(C_IMO);b.extras=(b.extras_txt||'').split('\n').map(s=>s.trim()).filter(Boolean).map(s=>{const[d,ins]=s.split(/\s+—\s+|\s+-\s+/);return{descricao:d,inscricao:ins||null}});delete b.extras_txt;

async function modalAdm(id){const a=IMO.administracoes.find(x=>x.id===id)||{};const I=(await api('loc/imoveis')).filter(i=>i.proprietario_id&&i.proprietario_id===IMO.imovel.proprietario_id);

async function salvaAdm(id){const b=coleta(C_ADM);b.imoveis=[...document.querySelectorAll('.adm_im:checked')].map(x=>+x.value);if(!b.imoveis.length)return aviso('Marque pelo menos um imóvel.');b.proprietario_id=IMO.imovel.proprietario_id;await api('loc/administracao'+(id?'/'+id:''),{method:id?'PUT':'POST',body:b});fecha();ABA='adm';telaImovel(IMO.imovel.id)}

const lerB64=f=>new Promise((ok,er)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=er;r.readAsDataURL(f)});
/* foto do celular: reduz para no máximo 2000 px antes de enviar (fica leve e legível) */
function reduzFoto(f){return new Promise(ok=>{if(!/^image\//.test(f.type)||f.type==='image/gif')return ok(f);const img=new Image(),u=URL.createObjectURL(f);
  img.onload=()=>{const k=Math.min(1,2000/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>ok(b?new File([b],f.name.replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'}):f),'image/jpeg',0.85)};
  img.onerror=()=>ok(f);img.src=u})}
async function sobeArquivo(f,entidade,id,tipo){if(!/^image\//.test(f.type)&&f.type!=='application/pdf'&&!/\.pdf$/i.test(f.name)){aviso('Envie PDF ou foto.');throw new Error('tipo')}
  f=await reduzFoto(f);
  if(f.size>4.5e6){aviso('Arquivo maior que 4,5 MB. Reduza o PDF antes de anexar.');throw new Error('grande')}
  return api('loc/documento',{method:'POST',body:{entidade,entidade_id:id,tipo,nome:f.name,mime:f.type,base64:await lerB64(f)}})}
function desenhaDocs(el,ent,id,L){el.innerHTML=`<div class="card noprint"><div class="bt"><select id="d_t" style="max-width:260px">${['Contrato de locação assinado','Contrato de administração','Vistoria de entrada','Vistoria de saída','Documentos pessoais','Comprovante de repasse','Conta paga (desconto)','Boleto','Recibo','Confissão de dívida','Acerto de saída','Outros'].map(t=>`<option>${t}</option>`).join('')}</select>
  <input id="d_f" type="file" accept="application/pdf,image/*" multiple style="max-width:320px"><button class="pri" onclick="anexa('${ent}',${id},this)">Anexar</button></div></div>
  <div class="cgrid">${L.map(d=>`<div class="cb azul"><b>${esc(d.tipo||'Documento')}</b><span>${esc(d.nome)}</span><span class="mut">${dbr(d.em)} · ${Math.round((d.bytes||0)/1024)} KB</span><div class="bt"><button onclick="abreDoc(${d.id})">Abrir</button><button class="per" onclick="apagaDoc(${d.id},'${ent}',${id})">Excluir</button></div></div>`).join('')||'<div class="mut">Nenhum documento anexado.</div>'}</div>`}
async function anexa(ent,id,bt){const fs=[...$('#d_f').files];if(!fs.length)return aviso('Escolha o arquivo');bt.disabled=true;
  try{for(const f of fs)await sobeArquivo(f,ent,id,val('d_t'))}finally{bt.disabled=false}route()}
async function abreDoc(id){const w=window.open('','_blank');const r=await fetch(BASE+'/api/loc/documento/'+id,{headers:{authorization:'Bearer '+TOKEN}});if(!r.ok){w.close();return aviso('Não consegui abrir o arquivo')}w.location=URL.createObjectURL(await r.blob())}
async function baixaCopia(){const r=await fetch(BASE+'/api/loc/copia',{headers:{authorization:'Bearer '+TOKEN}});if(!r.ok)return aviso('Não consegui gerar a cópia');const a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download='locacao-'+hoje()+'.json';a.click()}
async function apagaDoc(id){if(!confirm('Excluir esse documento?'))return;await api('loc/documento/'+id,{method:'DELETE'});route()}

async function enviaLocacao(id,b){const url=BASE+'/api/loc/locacao'+(id?'/'+id:'');
  const vai=async body=>{const r=await fetch(url,{method:id?'PUT':'POST',headers:{authorization:'Bearer '+TOKEN,'content-type':'application/json'},body:JSON.stringify(body)});return{st:r.status,d:await r.json().catch(()=>({erro:'Resposta inválida do servidor'}))}};
  let {st,d}=await vai(b);
  if(st===409&&d.precisa_aprovacao){
    if(!d.pode_aprovar){aviso('Essa locação contraria o contrato de administração. Só o administrador pode aprovar.');return null}
    if(!confirm('ATENÇÃO — o contrato de administração não permite isso:\n\n• '+d.conflitos.join('\n• ')+'\n\nVocê, como administrador, aprova essa exceção? (fica registrado)'))return null;
    ({st,d}=await vai({...b,aprovar_excecao:true}))}
  if(st===401){telaLogin(d?.erro);return null}
  if(st>=400||d?.erro){aviso(d?.erro||'Erro');return null}
  return d}

   <div id="ct_t" contenteditable="true" spellcheck="true" style="background:#fff;color:#111;font-family:Arial;font-size:13px;line-height:1.45;padding:40px 48px;border:1px solid var(--ln);min-height:50vh;text-align:justify">${x.html}</div>
   <div class="bt" style="margin-top:10px;position:sticky;bottom:0;background:var(--card);padding-top:8px"><button class="pri" onclick="salvaDocGerado()">Salvar</button><button onclick="CT={titulo:DOC.titulo};wordContrato()">Baixar Word</button><button onclick="CT={titulo:DOC.titulo};pdfContrato()">Imprimir / PDF</button>
    ${x.id?`<button onclick="CT={ent:'locacao',id:${DL.id}};sobeAssinado()">Subir versão assinada</button><button class="per" onclick="apagaDocGerado(${x.id})">Excluir</button>`:''}</div>`);
  const st=document.createElement('style');st.textContent='#ct_t h1{font-size:17px;text-align:center;margin:0 0 4px}#ct_t p{margin:0 0 8px}';$('#ct_t').prepend(st)}
async function salvaDocGerado(){const h=$('#ct_t').innerHTML.replace(/<style>[\s\S]*?<\/style>/,'');
  if(DOC.id)await api('loc/doc-gerado/'+DOC.id,{method:'PUT',body:{html:h}});else{const r=await api('loc/doc-gerado',{method:'POST',body:{locacao_id:DL.id,tipo:DOC.tipo,titulo:DOC.titulo,dados:DOC.dados,html:h}});DOC.id=r.id}
  DOC.html=h;aviso('Documento salvo.');abreDocEditor(DOC)}
async function apagaDocGerado(id){if(!confirm('Excluir este documento?'))return;await api('loc/doc-gerado/'+id,{method:'DELETE'});modalDocsLoc(DL.id)}
</script>
</body>
</html>
